name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Hourly pushes can stack up; only the newest one matters.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Packaging and publishing are separate jobs (GitHub's recommended layout). With both in one
  # job, deploy-pages sometimes looked for the package before GitHub had registered it and failed
  # with 'No artifacts named "github-pages"' (every push on 2026-11-23 afternoon).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Refuse to deploy malformed data; the previously deployed site stays up.
      - name: Validate availability.json
        run: node scripts/validate.js --structure-only

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
